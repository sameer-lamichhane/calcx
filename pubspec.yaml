name: calcx
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.3
  google_sign_in: ^6.2.1
  # Local storage
  shared_preferences: ^2.3.2
  
  # Date formatting
  intl: ^0.19.0
  
  # Image picking
  image_picker: ^1.0.7
  
  # Crypto for hashing
  crypto: ^3.0.3
  
  # File handling
  path_provider: ^2.1.2
  share_plus: ^10.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  image_path: "assets/calcx.jpg"

flutter:

  uses-material-design: true
